webrick:
  headers:
    Content-Security-Policy: >-
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://unpkg.com https://platform.twitter.com https://www.googletagmanager.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com;
      font-src 'self' https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com;
      img-src 'self' https://syndication.twitter.com https://platform.twitter.com https://www.google-analytics.com;
      connect-src 'self' https://faro-collector-prod-sa-east-1.grafana.net https://www.google-analytics.com https://analytics.google.com;
      frame-src https://platform.twitter.com;

plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: pretty

